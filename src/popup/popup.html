<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShowPFS allowlist</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>ShowPFS</h1>
        <label class="toggle" title="Enable / disable annotation">
          <input type="checkbox" id="enabled-toggle" />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <p class="muted">Annotate PFS on these hosts:</p>
    </header>
    <ul id="list"></ul>
    <form id="add-form">
      <input
        id="add-input"
        type="text"
        placeholder="example.edu.tw"
        autocomplete="off"
        spellcheck="false"
      />
      <button type="submit">Add</button>
    </form>
    <footer>
      <button id="reset" type="button" class="link">Reset to defaults</button>
    </footer>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
